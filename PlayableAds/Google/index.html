<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="ad.orientation" content="portrait,landscape">
  <meta name="ad.size" content="width=320,height=480">
  <title>Pixel Pour Playable</title>
  <script src="https://tpc.googlesyndication.com/pagead/gadgets/html5/api/exitapi.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="stage" id="stage" aria-label="Pixel Pour playable game">
    <img class="decor pyramid-left" src="assets/pyramid.png" alt="">
    <img class="decor pyramid-right" src="assets/pyramid.png" alt="">
    <img class="decor cactus-a" src="assets/cactus.png" alt="">
    <img class="decor cactus-b" src="assets/cactus.png" alt="">
    <img class="decor rocks-a" src="assets/rocks.png" alt="">
    <img class="decor rocks-b" src="assets/rocks.png" alt="">
    <img class="decor bones-a" src="assets/bones.png" alt="">
    <img class="decor bones-b" src="assets/bones.png" alt="">

    <header class="hud">
      <div class="hud-pill">Level 1</div>
      <div class="hud-pill hud-stat"><img class="hud-icon" src="assets/heart.png" alt=""><span id="lives">3</span></div>
      <div class="hud-pill hud-stat"><img class="hud-icon" src="assets/coin.png" alt=""><span id="coins">1000</span></div>
    </header>

    <section class="portrait-shell" aria-label="Portrait board">
      <canvas id="portrait" width="560" height="560"></canvas>
    </section>

    <section class="slots" id="slots" aria-label="Panda slots"></section>
    <section class="queue" id="queue" aria-label="Panda queue"></section>
    <img class="hand" id="hand" src="assets/hand.png" alt="">

    <nav class="booster-bar" aria-label="Boosters">
      <button class="booster" id="fire" aria-label="Giant cube"><img src="assets/fire.png" alt=""><span class="booster-count">2</span></button>
      <button class="booster" id="hammer" aria-label="Hammer"><img src="assets/hammer.png" alt=""><span class="booster-count">1</span></button>
      <button class="booster" id="extra" aria-label="Extra slot"><img src="assets/extra-slot.png" alt=""><span class="booster-count">3</span></button>
      <button class="booster" id="settings" aria-label="Settings"><img src="assets/settings.png" alt=""></button>
    </nav>

    <section class="end-card" id="endCard">
      <img class="end-logo" src="assets/logo.png" alt="Pixel Pour">
      <h1 class="end-title">Picture complete!</h1>
      <div class="end-portrait"><canvas id="endPortrait" width="560" height="560"></canvas></div>
      <button class="cta" id="cta">PLAY NOW</button>
    </section>
  </main>

  <script src="assets/level1.js"></script>
  <script src="game.js"></script>
</body>
</html>
